# Written by tools/boost-ports.py. Do not edit: run the script again.
#
# Every Boost library there is a port for, for a change to the ports or to the script that writes them.
#
# One job per Boost library, each waiting for the libraries it is built on,
# in the order Boost's own dependency graph gives. A job apiece says which
# library broke rather than which build did; the waiting means a broken leaf
# skips what is above it instead of failing it many times over.
name: boost-all

on:
  push:
    paths:
      - 'registry/boost*/**'
      - 'tools/boost-ports.py'
      - '.github/workflows/boost-all.yml'
  workflow_dispatch:

jobs:
  boost-system:
    needs: [boost-assert, boost-compat, boost-config, boost-throw-exception, boost-variant2, boost-winapi]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/boost-library
        with:
          port: boost-system
          package: boost_system
          target: Boost::system
  boost-multi-array:
    needs: [boost-array, boost-assert, boost-concept-check, boost-config, boost-core, boost-functional, boost-iterator, boost-mpl, boost-type-traits]
