# What is checked, and how often.
#
# The expensive thing here is not the download, it is the compiling: a
# from-source build of every library is half an hour of the same objects
# nobody changed. So three things are reused. Sources are kept in a cache
# keyed by the pins, so a library is fetched once until its port changes.
# Object files are kept by ccache, so a rebuild of an unchanged library is a
# cache hit rather than a compile. And the runs that cannot reuse anything --
# every library from source, and Skia -- happen on a schedule rather than on
# every push.
#
# One job per library, so a port that has rotted is named rather than being
# one line in somebody else's log.

name: check

on:
  push:
    # Nothing here tests a paragraph, and the Guix job below is a hundred and
    # thirty megabytes and a daemon.
    paths-ignore:
      - 'README.md'
      - 'LICENSE'
  pull_request:
  schedule:
    # Monday morning. This is the one that finds a library whose upstream
    # moved under a port that nobody touched.
    - cron: "0 6 * * 1"
  workflow_dispatch:

env:
  CPM_SOURCE_CACHE: ${{ github.workspace }}/.cache/sources
  CCACHE_DIR: ${{ github.workspace }}/.cache/ccache
  CCACHE_MAXSIZE: 2G

jobs:
  # Nothing is fetched and nothing is built: a name that is called and never
  # defined, a port that says nothing about what it produces, and every
  # refusal the registry is supposed to make.
  quick:
    runs-on: ubuntu-latest
    outputs:
      ports: ${{ steps.ports.outputs.list }}
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update || true; sudo apt-get install -y ninja-build
      - name: what can be checked without building
        run: python3 check.py
      - name: what a meson project's answer becomes
        run: python3 test/meson-import.py
      - name: what a make project's dry run becomes
        run: python3 test/make-import.py
      - id: ports
        run: echo "list=$(python3 check.py --matrix)" >> "$GITHUB_OUTPUT"
      - name: what a sandbox would have to fetch
        run: |
          set -e
          python3 tools/lock-to-nix.py test/lock/cme-lock.json > /tmp/sources.nix
          python3 tools/lock-to-guix.py test/lock/cme-lock.json > /tmp/sources.scm
          grep -q "builtins.fetchGit" /tmp/sources.nix
          grep -q "pkgs.fetchurl" /tmp/sources.nix
          grep -q "git-fetch" /tmp/sources.scm
          # The archive digest, in the base32 Guix reads. A wrong conversion
          # here is a hash that looks right and is not, which is the worst
          # kind, so the answer is written down rather than recomputed by the
          # thing being checked.
          grep -q "0pac7cm1j27pwvaw9cx2j607yvjx9hxjl3qc3r6qssqb1qdnm74a" /tmp/sources.scm
          # And the port nothing fetched is said out loud rather than left
          # out of a list that would then look complete.
          grep -q "boost" /tmp/sources.scm || true
          echo "  ok    the lock becomes what a sandbox fetches"

      - name: refusals
        run: |
          set -e
          for case in unknown-feature conflicting-features refused-feature \
                      implied-by-variable implied-through-a-chain \
                      licence missing-port; do
            if cmake -S "test/cases/$case" -B "build/$case" \
                 -DCMAKE_PROJECT_TOP_LEVEL_INCLUDES="$PWD/cmake-everywhere.cmake" \
                 -DCME_REGISTRY="$PWD/test/registry" >"build/$case.log" 2>&1
            then
              echo "$case configured and should not have"; exit 1
            fi
            echo "  refused: $case"
          done

  # All of Boost from the archive, in one build.
  #
  # The archive is one download of everything, so taking it once and
  # resolving every library against it is what a project that uses a lot of
  # Boost does. In one build because that is the shape of that path: the
  # download is shared and every dependent part links what was built a moment
  # earlier.
  #
  # Without the libraries that need an arrangement about the machine -- MPI,
  # Python -- which the ports say of themselves, so this asks for what there
  # is rather than repeating a list that would drift from theirs.
  boost-archive:
    needs: quick
    runs-on: ubuntu-latest
    name: all of boost, from the archive
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update || true; sudo apt-get install -y ninja-build ccache
      - uses: actions/cache@v4
        with:
          path: .cache/sources
          key: boost-archive-${{ hashFiles('registry/boost-archive/port.cmake') }}
      - uses: actions/cache@v4
        with:
          path: .cache/ccache
          key: boost-archive-ccache-${{ github.sha }}
          restore-keys: boost-archive-ccache-
      - name: all of it
        run: |
          export CPM_SOURCE_CACHE="$PWD/.cache/sources"
          export CCACHE_DIR="$PWD/.cache/ccache"
          components=$(python3 check.py --boost-components)
          tools/configure -S test/port -B build/boost -G Ninja \
            -DCMAKE_PROJECT_TOP_LEVEL_INCLUDES="$PWD/cmake-everywhere.cmake" \
            -DCME_SYSTEM=NEVER -DCME_STORE= -DCME_BOOST_ARCHIVE=ON \
            -DCME_PORT_PACKAGE=Boost -DCME_PORT_TARGETS=Boost::boost \
            -DCME_PORT_COMPONENTS="$components" \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          cmake --build build/boost
          ./build/boost/cme-port
      - run: ccache --show-stats

  # Boost from the system, which is the path a distribution's user takes and
  # nothing here had ever run. Everything else about Boost in this build
  # takes CME_SYSTEM=NEVER, so the family agreeing to come from the system,
  # the per-library config files a distribution ships, and the umbrella
  # reporting what the family settled on were all untested.
  #
  # The assertion that matters is the second one: nothing was fetched. A
  # build that quietly downloaded and built Boost beside an installed one
  # would pass every other check in this file.
  boost-from-the-system:
    needs: quick
    runs-on: ubuntu-latest
    name: boost from the system
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get update || true
          sudo apt-get install -y ninja-build libboost-all-dev
      - name: the installed one, and nothing downloaded
        run: |
          export CPM_SOURCE_CACHE="$PWD/.cache/sources"
          cmake -S test/port -B build/system -G Ninja \
            -DCMAKE_PROJECT_TOP_LEVEL_INCLUDES="$PWD/cmake-everywhere.cmake" \
            -DCME_LOCK= -DCME_STORE= \
            -DCME_PORT_PACKAGE=Boost \
            -DCME_PORT_TARGETS=Boost::boost \
            -DCME_PORT_COMPONENTS="filesystem;system"
          cmake --build build/system
          ./build/system/cme-port
          echo "--- what it decided"
          cat build/system/cme-report.txt
          # The umbrella itself, because that is how a machine has Boost:
          # one package with one config, not a hundred and fifty-eight
          # installable pieces.
          grep -qE "^Boost (system|pkg-config)" build/system/cme-report.txt
          if ls .cache/sources 2>/dev/null | grep -q boost; then
            echo "it downloaded Boost while a Boost was installed:"
            ls .cache/sources
            exit 1
          fi

  # A machine with no /usr, and a build with no network.
  #
  # Nothing here looks for a library by path -- the system is asked through
  # find_package and pkg-config, which read CMAKE_PREFIX_PATH and
  # PKG_CONFIG_PATH -- and this is where that stops being a claim. Nix puts
  # every package in a directory of its own with a hash in the name, so a
  # build that had a /usr in it anywhere fails here and nowhere else.
  #
  # And the offline half, which is the same machine's other rule: a sandboxed
  # build has no network, so what is fetched has to be fetched beforehand.
  # The fetching runs with a network and the building runs without one, in a
  # network namespace of its own, so "did not reach for it" is a fact rather
  # than a hope.
  no-usr:
    needs: quick
    runs-on: ubuntu-latest
    name: no /usr, no network
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v27
        with:
          # A revision rather than a channel. A channel is a name that moves,
          # and this repository spends its time telling people not to build
          # against those.
          nix_path: nixpkgs=https://github.com/NixOS/nixpkgs/archive/ac62194c3917d5f474c1a844b6fd6da2db95077d.tar.gz
      - name: a library the machine has, found without a /usr
        run: |
          nix-shell -p cmake ninja gcc pkg-config zlib --run '
            set -e
            cmake -S test/port -B build/nix -G Ninja \
              -DCME_LOCK= -DCME_STORE= \
              -DCMAKE_PROJECT_TOP_LEVEL_INCLUDES="$PWD/cmake-everywhere.cmake" \
              -DCME_PORT_PACKAGE=ZLIB -DCME_PORT_TARGETS=ZLIB::ZLIB \
              -DCME_PORT_INCLUDE=zlib.h
            cmake --build build/nix
            ./build/nix/cme-port
            cat build/nix/cme-report.txt
            grep -qE "^ZLIB (system|pkg-config)" build/nix/cme-report.txt
          '
      - name: our digest of a directory against nix's
        run: |
          mkdir -p /tmp/tree/sub
          printf 'hello\n' > /tmp/tree/a.txt
          printf '#!/bin/sh\n' > /tmp/tree/sub/run.sh
          chmod +x /tmp/tree/sub/run.sh
          ln -sf a.txt /tmp/tree/link
          ours=$(python3 tools/nar-hash.py /tmp/tree)
          theirs=$(nix hash path --type sha256 --base32 /tmp/tree)
          echo "ours   $ours"
          echo "nix    $theirs"
          # An implementation of somebody else's format that is never
          # compared to theirs produces a plausible-looking string, and a
          # plausible-looking hash is the worst kind of wrong answer: it is
          # accepted, and what it names is not what arrives.
          test "$ours" = "$theirs"

      # The generated file, used for what it is for. A lock is written by a
      # real build, turned into Nix, and given to Nix -- which fetches every
      # source in it and checks each digest itself. A hash this computed
      # wrongly is a build failure here rather than a plausible string in a
      # file nobody ran.
      - name: a package built out of what the generator wrote
        run: |
          nix-shell -p cmake ninja gcc pkg-config git nix --run '
            set -e
            cmake -S test/port -B build/lock -G Ninja \
              -DCMAKE_PROJECT_TOP_LEVEL_INCLUDES="$PWD/cmake-everywhere.cmake" \
              -DCPM_SOURCE_CACHE="$PWD/vendor" -DCME_STORE= \
              -DCME_LOCK="$PWD/build/cme-lock.json" -DCME_LOCK_ALL=ON \
              -DCME_PORT_PACKAGE=ZLIB -DCME_PORT_TARGETS=ZLIB::ZLIB \
              -DCME_PORT_INCLUDE=zlib.h
            cat build/cme-lock.json
            python3 tools/lock-to-nix.py build/cme-lock.json "$PWD/vendor" \
              > build/sources.nix
            cat build/sources.nix
          '
          nix-build --no-out-link --expr '
            with import <nixpkgs> { };
            let sources = import ./build/sources.nix { }; in
            runCommand "fetched" { } "
              test -f ${sources.zlib}/zlib.h
              touch $out
            "'

      - name: fetched with a network, built without one
        run: |
          nix-shell -p cmake ninja gcc pkg-config git --run '
            set -e
            cmake -S tools/prefetch -B build/prefetch \
              -DCMAKE_PROJECT_TOP_LEVEL_INCLUDES="$PWD/cmake-everywhere.cmake" \
              -DCPM_SOURCE_CACHE="$PWD/vendor" \
              -DCME_PREFETCH="zlib;libpng"
          '
          # Unprivileged network namespaces are how this is proved rather
          # than asserted. Where they are not allowed, the build still has to
          # pass and the log says the proof was weaker.
          # Ubuntu restricts unprivileged user namespaces through AppArmor,
          # which is what turned this proof into a request last time. The
          # runner has sudo; the restriction is one number.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 \
            >/dev/null 2>&1 || true
          if unshare -rn true 2>/dev/null; then
            run="unshare -rn"
            echo "offline is enforced: this runs with no network at all"
          else
            run=""
            echo "no network namespace here: offline is asked for, not enforced"
          fi
          $run nix-shell -p cmake ninja gcc pkg-config --run '
            set -e
            cmake -S test/port -B build/offline -G Ninja \
              -DCME_LOCK= -DCME_STORE= -DCME_SYSTEM=NEVER -DCME_OFFLINE=ON \
              -DCPM_SOURCE_CACHE="$PWD/vendor" \
              -DCMAKE_PROJECT_TOP_LEVEL_INCLUDES="$PWD/cmake-everywhere.cmake" \
              -DCME_PORT_PACKAGE=PNG -DCME_PORT_TARGETS=PNG::PNG \
              -DCME_PORT_INCLUDE=png.h
            cmake --build build/offline
            ./build/offline/cme-port
          '

  # The same two questions on Guix, which answers them differently enough to
  # be worth asking twice.
  no-usr-guix:
    runs-on: ubuntu-latest
    needs: quick
    name: no /usr, no network, on guix
    steps:
      - uses: actions/checkout@v4
      # The tarball, kept between runs. It is a hundred and thirty megabytes
      # of a fixed version with a fixed digest, so fetching it again every
      # time is asking a mirror for something we already have.
      - uses: actions/cache@v4
        with:
          path: guix-binary-1.5.0.x86_64-linux.tar.xz
          key: guix-binary-1.5.0
      - name: guix
        run: |
          # The installer fetches through ftpmirror.gnu.org, which is a
          # redirector, and the redirector answers 502 -- steadily, not once.
          # The mirrors it would have sent us to are all fine, so the tarball
          # is fetched from one of them here and the installer is handed it.
          #
          # And pinned, because this is a hundred and thirty megabytes of
          # binaries about to be run as root: a mirror is a machine that is
          # not GNU's, and the digest is what makes which mirror answered
          # not matter.
          version=1.5.0
          file=guix-binary-$version.x86_64-linux.tar.xz
          digest=aa41025489c5061543e9c48873eaa829b900b2da75d40f9648913622f5f47817
          if [ -f "$file" ] && echo "$digest  $file" | sha256sum -c - >/dev/null 2>&1
          then
            echo "already here, and it is the right one"
          else
          for mirror in https://ftp.gnu.org/gnu/guix \
                        https://mirrors.kernel.org/gnu/guix \
                        https://ftp.funet.fi/pub/gnu/prep/guix \
                        https://mirror.us-midwest-1.nexcess.net/gnu/guix; do
            echo "trying $mirror"
            if wget -q -O "$file" "$mirror/$file"; then
              break
            fi
          done
          fi
          echo "$digest  $file" | sha256sum -c - || {
            echo "what arrived is not what was asked for; stopping"
            exit 1
          }
          wget -q https://guix.gnu.org/install.sh
          # Newlines, not y: the installer says so itself, and says that
          # anything else is unsupported and likely to break.
          yes '' | sudo -E env GUIX_BINARY_FILE_NAME="$PWD/$file" \
            bash install.sh || {
            echo "Guix did not install. Nothing about this repository was"
            echo "checked by this run."
            exit 1
          }
          echo "/var/guix/profiles/per-user/root/current-guix/bin" >> "$GITHUB_PATH"

      - name: a library the machine has, found without a /usr
        run: |
          guix shell nss-certs cmake ninja gcc-toolchain pkg-config zlib -- sh -c '
            set -e
            # A shell with no certificates cannot check one, and anything
            # that reaches the network then fails on the certificate rather
            # than on the reaching.
            export SSL_CERT_FILE="$GUIX_ENVIRONMENT/etc/ssl/certs/ca-certificates.crt"
            export SSL_CERT_DIR="$GUIX_ENVIRONMENT/etc/ssl/certs"
            cmake -S test/port -B build/guix -G Ninja \
              -DCME_LOCK= -DCME_STORE= \
              -DCMAKE_PROJECT_TOP_LEVEL_INCLUDES="$PWD/cmake-everywhere.cmake" \
              -DCME_PORT_PACKAGE=ZLIB -DCME_PORT_TARGETS=ZLIB::ZLIB \
              -DCME_PORT_INCLUDE=zlib.h
            cmake --build build/guix
            ./build/guix/cme-port
            cat build/guix/cme-report.txt
            grep -qE "^ZLIB (system|pkg-config)" build/guix/cme-report.txt
          '
      - name: our digest of a directory against guix's
        run: |
          mkdir -p /tmp/tree/sub
          printf 'hello\n' > /tmp/tree/a.txt
          printf '#!/bin/sh\n' > /tmp/tree/sub/run.sh
          chmod +x /tmp/tree/sub/run.sh
          ours=$(python3 tools/nar-hash.py /tmp/tree)
          theirs=$(guix hash -r /tmp/tree)
          echo "ours   $ours"
          echo "guix   $theirs"
          test "$ours" = "$theirs"

      - name: fetched with a network, built without one
        run: |
          guix shell nss-certs cmake ninja gcc-toolchain pkg-config git -- sh -c '
            set -e
            # A shell with no certificates cannot check one, and anything
            # that reaches the network then fails on the certificate rather
            # than on the reaching.
            export SSL_CERT_FILE="$GUIX_ENVIRONMENT/etc/ssl/certs/ca-certificates.crt"
            export SSL_CERT_DIR="$GUIX_ENVIRONMENT/etc/ssl/certs"
            cmake -S tools/prefetch -B build/prefetch \
              -DCMAKE_PROJECT_TOP_LEVEL_INCLUDES="$PWD/cmake-everywhere.cmake" \
              -DCPM_SOURCE_CACHE="$PWD/vendor" \
              -DCME_PREFETCH="zlib;libpng"
          '
          # Ubuntu restricts unprivileged user namespaces through AppArmor,
          # which is what turned this proof into a request last time. The
          # runner has sudo; the restriction is one number.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 \
            >/dev/null 2>&1 || true
          if unshare -rn true 2>/dev/null; then
            run="unshare -rn"
            echo "offline is enforced: this runs with no network at all"
          else
            run=""
            echo "no network namespace here: offline is asked for, not enforced"
          fi
          $run guix shell nss-certs cmake ninja gcc-toolchain pkg-config -- sh -c '
            set -e
            # A shell with no certificates cannot check one, and anything
            # that reaches the network then fails on the certificate rather
            # than on the reaching.
            export SSL_CERT_FILE="$GUIX_ENVIRONMENT/etc/ssl/certs/ca-certificates.crt"
            export SSL_CERT_DIR="$GUIX_ENVIRONMENT/etc/ssl/certs"
            cmake -S test/port -B build/offline -G Ninja \
              -DCME_LOCK= -DCME_STORE= -DCME_SYSTEM=NEVER -DCME_OFFLINE=ON \
              -DCPM_SOURCE_CACHE="$PWD/vendor" \
              -DCMAKE_PROJECT_TOP_LEVEL_INCLUDES="$PWD/cmake-everywhere.cmake" \
              -DCME_PORT_PACKAGE=PNG -DCME_PORT_TARGETS=PNG::PNG \
              -DCME_PORT_INCLUDE=png.h
            cmake --build build/offline
            ./build/offline/cme-port
          '
          # And the other direction: the lock this job just wrote, turned
          # into what Guix would be handed. The sources are in vendor, so
          # every digest can be computed -- an empty one here would mean the
          # filling does not work, which is the half the Nix job proves by
          # handing its file to Nix.
          python3 tools/lock-to-guix.py tools/prefetch/cme-lock.json \
            "$PWD/vendor" > /tmp/sources.scm
          cat /tmp/sources.scm
          if grep -q 'base32 ""' /tmp/sources.scm; then
            echo "a digest was left empty while the sources were at hand"
            exit 1
          fi
          # And the fixture, which has a source nothing fetched in it: that
          # one has to come out empty and say so, because a generated file
          # that fills in what it does not know is worse than one that does
          # not.
          python3 tools/lock-to-guix.py test/lock/cme-lock.json > /tmp/unknown.scm
          grep -q 'base32 ""' /tmp/unknown.scm

  # A project that asks pkg-config instead of find_package, which is most of
  # them. With nothing allowed from the system the only answer available is
  # a port, so a link here means a pkg-config call was answered by something
  # that is not pkg-config.
  pkgconfig:
    needs: quick
    runs-on: ubuntu-latest
    name: asked through pkg-config
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update || true; sudo apt-get install -y ninja-build pkg-config
      - run: |
          cmake -S test/pkgconfig -B build/pkgconfig -G Ninja \
            -DCMAKE_PROJECT_TOP_LEVEL_INCLUDES="$PWD/cmake-everywhere.cmake" \
            -DCME_SYSTEM=NEVER -DCME_LOCK= -DCME_STORE=
          cmake --build build/pkgconfig
          ./build/pkgconfig/cme-pkgconfig
          ./build/pkgconfig/cme-pkgconfig-again

  # Whether a project that builds with Meson can be a port. Nothing here
  # installs basu: it is fetched, configured by meson, read, and built in
  # this build with this toolchain, and the program links against what came
  # out. CME_SYSTEM=NEVER so that an installed libsystemd cannot answer
  # instead and leave the import untested.
  meson:
    needs: quick
    runs-on: ubuntu-latest
    name: a meson project, built here
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get update || true
          sudo apt-get install -y ninja-build meson gperf pkg-config
      - run: |
          cmake -S test/meson -B build/meson -G Ninja \
            -DCMAKE_PROJECT_TOP_LEVEL_INCLUDES="$PWD/cmake-everywhere.cmake" \
            -DCME_SYSTEM=NEVER -DCME_LOCK= -DCME_STORE=
          cmake --build build/meson
          ./build/meson/cme-meson
      - name: what the build decided
        if: always()
        run: cat build/meson/cme-report.txt || true

  # Whether a library nobody has ported can be used anyway. Everything this
  # one touches is made while it runs: an upstream repository, a directory of
  # ports, a repository of ports. Nothing is downloaded and nothing is in the
  # registry, which is the point of it.
  decentral:
    needs: quick
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update || true; sudo apt-get install -y ninja-build pkg-config zlib1g-dev
      - name: a port from the project, a directory and a repository
        run: test/decentral.sh "${{ github.workspace }}/build/decentral-check"
      - name: what the builds decided
        if: always()
        run: |
          for log in build/decentral-check/*.log; do
            echo "=== $log"; tail -30 "$log"
          done

  # Whether a library built once is found again, and not found when what it
  # was built with has changed in a way the mode does not allow. zlib,
  # because the question is about the store rather than about the library.
  store:
    needs: quick
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update || true; sudo apt-get install -y ninja-build ccache
      - uses: actions/cache@v4
        with:
          path: .cache/sources
          key: sources-store-${{ hashFiles('registry/zlib/*.cmake') }}
          restore-keys: sources-store-
      - name: built once, found again
        run: test/store.sh "${{ github.workspace }}/build/store-check"
      - name: what the builds decided
        if: always()
        run: |
          for log in build/store-check/*.log; do
            echo "=== $log"; tail -20 "$log"
          done

  # Every library on its own, taking what the runner already has where it
  # can. Cheap enough to run on a push.
  ports:
    needs: quick
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        port: ${{ fromJSON(needs.quick.outputs.ports) }}
    name: ${{ matrix.port.port }}
    steps:
      - uses: actions/checkout@v4
      - name: is this port for this machine
        id: applies
        run: |
          systems="${{ matrix.port.systems }}"
          if [ -z "$systems" ] || echo "$systems" | grep -q "Linux"; then
            echo "yes=true" >> "$GITHUB_OUTPUT"
          else
            echo "yes=false" >> "$GITHUB_OUTPUT"
            echo "${{ matrix.port.port }} is for $systems; this is Linux"
          fi
      - run: sudo apt-get update || true; sudo apt-get install -y ninja-build ccache
      - name: what this port needs to be built at all
        run: |
          case "${{ matrix.port.port }}" in
            # A window library needs the headers of the windowing systems it
            # is a window library for.
            glfw) sudo apt-get install -y xorg-dev libwayland-dev \
                    libxkbcommon-dev wayland-protocols ;;
            # A port that is imported from meson needs meson to read it,
            # and basu generates part of itself with gperf.
            basu) sudo apt-get install -y meson gperf ;;
            # Wayland is meson too, and libffi it finds on the machine:
            # expat comes from the port beside it.
            wayland) sudo apt-get install -y meson libffi-dev ;;
            # A project with a configure script of its own needs the shell
            # tools that script was written for. ffmpeg wants nasm on x86.
            ffmpeg) sudo apt-get install -y nasm ;;
          esac
      - uses: actions/cache@v4
        with:
          path: .cache/sources
          key: sources-${{ matrix.port.port }}-${{ hashFiles(format('registry/{0}/*.cmake', matrix.port.port)) }}
          restore-keys: sources-${{ matrix.port.port }}-
      - uses: actions/cache@v4
        with:
          path: .cache/ccache
          key: ccache-${{ matrix.port.port }}-${{ github.sha }}
          restore-keys: ccache-${{ matrix.port.port }}-
      - name: gn
        if: matrix.port.port == 'skia'
        run: |
          curl -sSL -o gn.zip "https://chrome-infra-packages.appspot.com/dl/gn/gn/linux-amd64/+/latest"
          mkdir -p "$HOME/.local/bin" && unzip -o -j gn.zip gn -d "$HOME/.local/bin"
          chmod +x "$HOME/.local/bin/gn" && echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: build it on its own
        if: steps.applies.outputs.yes == 'true'
        run: |
          # The umbrella is the one job that takes Boost as the archive:
          # one download of everything rather than a repository each, which
          # is the choice a project using a lot of Boost would make.
          extra=""
          if [ "${{ matrix.port.port }}" = "boost" ]; then
            extra="-DCME_BOOST_ARCHIVE=ON -DCME_PORT_COMPONENTS=filesystem"
          fi
          cmake -S test/port -B build/port -G Ninja \
            -DCMAKE_PROJECT_TOP_LEVEL_INCLUDES="$PWD/cmake-everywhere.cmake" \
            -DCME_PORT_PACKAGE="${{ matrix.port.package }}" \
            -DCME_PORT_TARGETS="${{ matrix.port.targets }}" \
            -DCME_PORT_INCLUDE="${{ matrix.port.header }}" \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache $extra
          cmake --build build/port
          ./build/port/cme-port
      - run: ccache --show-stats

  # The same, with nothing taken from the runner. This is the run that says
  # whether the ports can still build what they claim to, and it is the one
  # that costs, so it is weekly.
  from-source:
    needs: quick
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        port: ${{ fromJSON(needs.quick.outputs.ports) }}
    name: ${{ matrix.port.port }} from source
    steps:
      - uses: actions/checkout@v4
      - name: is this port for this machine
        id: applies
        run: |
          systems="${{ matrix.port.systems }}"
          if [ -z "$systems" ] || echo "$systems" | grep -q "Linux"; then
            echo "yes=true" >> "$GITHUB_OUTPUT"
          else
            echo "yes=false" >> "$GITHUB_OUTPUT"
            echo "${{ matrix.port.port }} is for $systems; this is Linux"
          fi
      - run: sudo apt-get update || true; sudo apt-get install -y ninja-build ccache
      - name: what this port needs to be built at all
        run: |
          case "${{ matrix.port.port }}" in
            # A window library needs the headers of the windowing systems it
            # is a window library for.
            glfw) sudo apt-get install -y xorg-dev libwayland-dev \
                    libxkbcommon-dev wayland-protocols ;;
            # A port that is imported from meson needs meson to read it,
            # and basu generates part of itself with gperf.
            basu) sudo apt-get install -y meson gperf ;;
            # Wayland is meson too, and libffi it finds on the machine:
            # expat comes from the port beside it.
            wayland) sudo apt-get install -y meson libffi-dev ;;
            # A project with a configure script of its own needs the shell
            # tools that script was written for. ffmpeg wants nasm on x86.
            ffmpeg) sudo apt-get install -y nasm ;;
          esac
      - uses: actions/cache@v4
        with:
          path: .cache/sources
          key: sources-${{ matrix.port.port }}-${{ hashFiles(format('registry/{0}/*.cmake', matrix.port.port)) }}
          restore-keys: sources-${{ matrix.port.port }}-
      - uses: actions/cache@v4
        with:
          path: .cache/ccache
          key: ccache-source-${{ matrix.port.port }}-${{ github.sha }}
          restore-keys: ccache-source-${{ matrix.port.port }}-
      - name: gn
        if: matrix.port.port == 'skia'
        run: |
          curl -sSL -o gn.zip "https://chrome-infra-packages.appspot.com/dl/gn/gn/linux-amd64/+/latest"
          mkdir -p "$HOME/.local/bin" && unzip -o -j gn.zip gn -d "$HOME/.local/bin"
          chmod +x "$HOME/.local/bin/gn" && echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: build it and everything under it
        if: steps.applies.outputs.yes == 'true'
        run: |
          cmake -S test/port -B build/port -G Ninja \
            -DCMAKE_PROJECT_TOP_LEVEL_INCLUDES="$PWD/cmake-everywhere.cmake" \
            -DCME_SYSTEM=NEVER \
            -DCME_PORT_PACKAGE="${{ matrix.port.package }}" \
            -DCME_PORT_TARGETS="${{ matrix.port.targets }}" \
            -DCME_PORT_INCLUDE="${{ matrix.port.header }}" \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          cmake --build build/port
          ./build/port/cme-port
      - run: ccache --show-stats

  # The one that proves the libraries reached are the ones this registry
  # built, rather than something the linker found. Weekly, because it is
  # Skia with three features from source.
  skia-features:
    needs: quick
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update || true; sudo apt-get install -y ninja-build ccache
      - uses: actions/cache@v4
        with:
          path: .cache/sources
          key: sources-skia-${{ hashFiles('registry/*/*.cmake') }}
          restore-keys: sources-skia-
      - uses: actions/cache@v4
        with:
          path: .cache/ccache
          key: ccache-skia-features-${{ github.sha }}
          restore-keys: ccache-skia-features-
      - name: gn
        run: |
          curl -sSL -o gn.zip "https://chrome-infra-packages.appspot.com/dl/gn/gn/linux-amd64/+/latest"
          mkdir -p "$HOME/.local/bin" && unzip -o -j gn.zip gn -d "$HOME/.local/bin"
          chmod +x "$HOME/.local/bin/gn" && echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: skia with gl, png and freetype, from source
        run: |
          cmake -S test/skia -B build/skia -G Ninja \
            -DCMAKE_PROJECT_TOP_LEVEL_INCLUDES="$PWD/cmake-everywhere.cmake" \
            -DCME_SYSTEM=NEVER \
            -DCME_FEATURES_skia="gl;png;freetype" \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          cmake --build build/skia
          ./build/skia/cme-skia
      - run: ccache --show-stats
