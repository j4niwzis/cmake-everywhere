# Written by tools/boost-ports.py. Do not edit: run the script again.
#
# The Boost libraries that have broken here, for a change to the machinery rather than to the ports.
#
# One job per Boost library, each waiting for the libraries it is built on,
# in the order Boost's own dependency graph gives. A job apiece says which
# library broke rather than which build did; the waiting means a broken leaf
# skips what is above it instead of failing it many times over.
name: boost

on:
  push:
    paths:
      - 'cmake-everywhere.cmake'
      - 'cmake/**'
      - '.github/actions/boost-library/**'
      - '.github/workflows/boost.yml'
  workflow_dispatch:

jobs:
  boost-system:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/boost-library
        with:
          port: boost-system
          package: boost_system
          target: Boost::system
  boost-functional:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/boost-library
        with:
          port: boost-functional
          package: boost_functional
          target: Boost::functional
  boost-thread:
    needs: [boost-atomic, boost-chrono, boost-container, boost-date-time, boost-system]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/boost-library
        with:
          port: boost-thread
          package: boost_thread
          target: Boost::thread
  boost-date-time:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/boost-library
        with:
          port: boost-date-time
          package: boost_date_time
          target: Boost::date_time
  boost-filesystem:
    needs: [boost-atomic, boost-system]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/boost-library
